version: "3.8"

# =============================================================================
# Trial Booking System — Frontend — Development / Shared Review
# =============================================================================
# Profile: Development
# Hot Reload: Enabled (npm run dev via volume mounts)
# Purpose:   Shared development server — points to external backend API
#
# Usage:
#   docker compose -f docker/docker-compose.dev.yml up
#
# Access:
#   Parent View : http://localhost:3002
#   Admin View  : http://localhost:3001
#
# Prerequisites:
#   - External backend API running (set NEXT_PUBLIC_API_URL in .env or environment)
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Trial Booking System — Parent View (apps/web)
  # ---------------------------------------------------------------------------
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: deps
      args:
        APP: web
        PORT: "3000"
    container_name: trial-booking-web-dev
    ports:
      - "3002:3000"
    volumes:
      - ..:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      # Override API URL with external backend (e.g., shared dev server)
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://host.docker.internal:3000/api/v1}
      - NEXT_PUBLIC_ADMIN_URL=${NEXT_PUBLIC_ADMIN_URL:-http://localhost:3001}
    command: npm run dev --workspace=apps/web
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - trial-booking-dev

  # ---------------------------------------------------------------------------
  # Trial Booking System — Admin View (apps/admin)
  # ---------------------------------------------------------------------------
  admin:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: deps
      args:
        APP: admin
        PORT: "3001"
    container_name: trial-booking-admin-dev
    ports:
      - "3001:3001"
    volumes:
      - ..:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      # Override API URL with external backend (e.g., shared dev server)
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://host.docker.internal:3000/api/v1}
      - NEXT_PUBLIC_WEB_URL=${NEXT_PUBLIC_WEB_URL:-http://localhost:3002}
    command: npm run dev --workspace=apps/admin
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - trial-booking-dev

networks:
  trial-booking-dev:
    driver: bridge
